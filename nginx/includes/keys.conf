location ^~ /keys/ {
    autoindex off;
    alias  /usr/share/nginx/keys/;
    types {
        text/plain                      pub;
        application/x-x509-ca-cert      crt pem;
    }
    default_type text/plain;
    charset utf-8;
    
    add_header 'Access-Control-Allow-Origin' '*';
}

location = /keys {
    return 404;
}
location = /keys/ {
    return 404;
}