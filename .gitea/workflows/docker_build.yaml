name: Build Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
    tags:
      - "v*"

env:
  ALPINE_VERSION: "3.24"
  HUGO_VERSION: "0.170.1"
  NGINX_TAG: 1.31-alpine-slim

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.REGISTRY_IMAGE }}

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.registry }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up QEMU
        if: |
          (matrix.platform == 'linux/arm64' && runner.arch != 'ARM64') ||
          (matrix.platform == 'linux/amd64' && runner.arch != 'X64')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          file: ./docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ vars.REGISTRY_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ vars.REGISTRY_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ vars.REGISTRY_IMAGE }}:buildcache,mode=max
          build-args: |
            BUILDTIME=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
            REVISION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            DOMAIN=${{ vars.DOMAIN }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
            NGINX_TAG=${{ env.NGINX_TAG }}
            HUGO_VERSION=${{ env.HUGO_VERSION }}
            RUNNER_TEMP=${{ env.RUNNER_TEMP }}
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: christopherhx/gitea-upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: [build]
    steps:
      - name: Download digests
        uses: christopherhx/gitea-download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.registry }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=edge,branch=main
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=false

      - name: Create manifest list and push tags (sequential)
        working-directory: ${{ runner.temp }}/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          REFS=$(printf '${{ vars.REGISTRY_IMAGE }}@sha256:%s ' *)

          # tags as a bash list
          mapfile -t TAG_LIST < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          for tag in "${TAG_LIST[@]}"; do
            echo "Pushing manifest tag: $tag"
            for i in 1 2 3 4 5; do
              if docker buildx imagetools create -t "$tag" $REFS; then
                break
              fi
              echo "Retry $i for $tag"
              sleep $((i*i*3))
              if [ "$i" -eq 5 ]; then
                echo "Failed pushing $tag"
                exit 1
              fi
            done
            sleep 2
          done

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ vars.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
